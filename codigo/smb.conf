# /etc/samba/smb.conf - Servidor de Archivos Samba Expreso Brasilia S.A.
[global]
   workgroup = BRASILIA
   server string = Servidor de Archivos Central Expreso Brasilia S.A.
   netbios name = SRV-BRASILIA
   security = user
   map to guest = bad user
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   server min protocol = SMB2_10

# Recurso compartido administrativo para personal de finanzas y gerencia
[brasilia-admin]
   comment = Documentos Administrativos y Financieros Expreso Brasilia
   path = /srv/samba/brasilia
   browseable = yes
   read only = no
   guest ok = no
   create mask = 0775
   directory mask = 0775
   valid users = @sambausers

# Recurso compartido de solo lectura para normatividad de transporte y minutas
[normatividad-publica]
   comment = Normas y Decretos Mintransporte y Supertransporte
   path = /srv/samba/publico
   browseable = yes
   read only = yes
   guest ok = yes
