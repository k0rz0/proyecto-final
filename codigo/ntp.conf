# /etc/ntp.conf - Servidor NTP Central Expreso Brasilia S.A.
driftfile /var/lib/ntp/ntp.drift
leapfile /usr/share/zoneinfo/leap-seconds.list

# Servidores de estrato superior (Hora oficial de Colombia y Suramérica)
server 0.co.pool.ntp.org iburst
server 1.co.pool.ntp.org iburst
server 2.south-america.pool.ntp.org iburst
server pool.ntp.org iburst

# Restricciones por defecto: denegar consultas no autorizadas
restrict -4 default kod notrap nomodify nopeer noquery limited
restrict -6 default kod notrap nomodify nopeer noquery limited

# Permitir control total al host local
restrict 127.0.0.1
restrict ::1

# Permitir a los clientes de la red corporativa de Expreso Brasilia sincronizar su hora
# (Taquillas de pasajes, torniquetes, GPS de buses y oficinas administrativas)
restrict 192.168.40.0 mask 255.255.255.0 nomodify notrap
restrict 192.168.1.0 mask 255.255.255.0 nomodify notrap
