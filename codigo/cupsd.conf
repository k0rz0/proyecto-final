# /etc/cups/cupsd.conf - Servidor de Impresión Central Expreso Brasilia S.A.
LogLevel warn
PageLogFormat
MaxLogSize 0

# Escuchar en todas las interfaces de red corporativas (puerto IPP 631)
Port 631
Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# Compartir impresoras en la red corporativa
Browsing On
BrowseLocalProtocols dnssd

# Autenticación y cifrado por defecto
DefaultAuthType Basic
DefaultEncryption IfRequested

# Restricción de acceso al servidor de impresión
<Location />
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.40.0/24
  Allow 192.168.1.0/24
</Location>

# Restricción al panel de administración web
<Location /admin>
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.40.0/24
  Require user @lpadmin
</Location>

# Configuración para archivos de configuración
<Location /admin/conf>
  AuthType Default
  Require user @lpadmin
  Order allow,deny
  Allow 127.0.0.1
  Allow 192.168.40.0/24
</Location>
